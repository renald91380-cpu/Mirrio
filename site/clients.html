<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiches clients — Cadence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2333;
    --ink-soft:#2A3346;
    --parchment:#F5F1E7;
    --parchment-dim:#EAE4D4;
    --slate:#8B8F98;
    --amber:#E2A63D;
    --amber-soft:#f0c98a;
    --teal:#3E7C74;
    --brick:#B5533F;
    --display:'Fraunces', Georgia, serif;
    --body:'Inter', Arial, sans-serif;
    --mono:'IBM Plex Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:var(--body);
    background:var(--parchment);
    color:var(--ink);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  img,svg{display:block;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit;}

  .logo{
    font-family:var(--display); font-weight:700; font-size:20px;
    display:flex; align-items:baseline; gap:2px;
  }
  .logo .dot{ color:var(--amber); animation:pulseDot 1.6s ease-in-out infinite; }
  @keyframes pulseDot{
    0%, 70%, 100%{ transform:scale(1); opacity:0.3; }
    35%{ transform:scale(1.9); opacity:1; background:var(--amber); }
  }
  @media (prefers-reduced-motion: reduce){ .logo .dot{ animation:none !important; opacity:0.6 !important; } }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:12px 20px; border-radius:6px; font-weight:600; font-size:14.5px;
    border:none; cursor:pointer; min-height:44px;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease, opacity .15s ease;
  }
  .btn-primary{ background:var(--amber); color:var(--ink); }
  .btn-primary:hover{ transform:translateY(-1px); box-shadow:0 8px 18px rgba(226,166,61,0.28); }
  .btn-ghost{ background:transparent; color:var(--parchment); border:1px solid rgba(245,241,231,0.28); }
  .btn-ghost:hover{ border-color:rgba(245,241,231,0.6); }
  .btn-text{ background:transparent; color:var(--ink); padding:10px 14px; }
  .btn-text:hover{ background:rgba(28,35,51,0.06); }
  .btn:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, button:focus-visible{
    outline:2px solid var(--teal); outline-offset:2px;
  }

  /* ---------- App header ---------- */
  .app-header{
    background:var(--ink); color:var(--parchment);
    padding:16px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .app-header-left{ display:flex; align-items:center; gap:28px; }
  .app-nav{ display:none; gap:20px; font-size:14px; font-weight:500; overflow-x:auto; }
  @media(min-width:640px){ .app-nav{ display:flex; } }
  .app-nav a{ color:rgba(245,241,231,0.6); padding:6px 0; border-bottom:2px solid transparent; white-space:nowrap; }
  .app-nav a:hover{ color:var(--parchment); }
  .app-nav a.active{ color:var(--parchment); border-bottom-color:var(--amber); }
  .app-header-right{ display:flex; align-items:center; gap:16px; }
  .user-email{ font-size:13px; color:rgba(245,241,231,0.55); display:none; }
  @media(min-width:640px){ .user-email{ display:block; } }

  /* ---------- Main ---------- */
  .app-main{ padding:36px 20px 60px; }
  .app-container{ max-width:880px; margin:0 auto; }
  .page-head{
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
    margin-bottom:32px; flex-wrap:wrap;
  }
  .page-head h1{ font-family:var(--display); font-weight:700; font-size:30px; margin-bottom:6px; }
  .page-head p{ font-size:14.5px; color:rgba(28,35,51,0.6); }

  /* ---------- Client list ---------- */
  .client-list{ display:flex; flex-direction:column; gap:10px; }
  .client-row{
    background:#fff; border:1px solid rgba(28,35,51,0.09); border-radius:12px;
    padding:18px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px;
    cursor:pointer; transition:box-shadow .15s ease, transform .15s ease;
  }
  .client-row:hover{ box-shadow:0 8px 20px rgba(28,35,51,0.07); transform:translateY(-1px); }
  .client-row-main{ min-width:0; }
  .client-row-main h3{ font-family:var(--display); font-size:17px; font-weight:600; margin-bottom:4px; }
  .client-row-meta{
    display:flex; flex-wrap:wrap; gap:4px 14px; font-size:13px; color:rgba(28,35,51,0.55);
  }
  .client-row-meta span{ display:inline-flex; align-items:center; gap:5px; }
  .client-row-actions{ display:flex; gap:4px; flex-shrink:0; }
  .icon-btn{
    width:38px; height:38px; border-radius:7px; border:none; background:transparent;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--slate);
  }
  .icon-btn:hover{ background:rgba(28,35,51,0.06); color:var(--ink); }
  .icon-btn.danger:hover{ background:rgba(181,83,63,0.1); color:var(--brick); }

  /* ---------- Empty state ---------- */
  .empty-state{
    text-align:center; padding:72px 20px; background:#fff;
    border:1px dashed rgba(28,35,51,0.18); border-radius:14px;
  }
  .empty-state .icon{
    width:52px; height:52px; border-radius:50%; background:var(--parchment-dim);
    display:flex; align-items:center; justify-content:center; margin:0 auto 20px;
  }
  .empty-state .icon svg{ stroke:var(--slate); }
  .empty-state h2{ font-family:var(--display); font-size:20px; margin-bottom:8px; }
  .empty-state p{ font-size:14px; color:rgba(28,35,51,0.55); margin-bottom:24px; }

  .loading-state{ text-align:center; padding:72px 20px; color:rgba(28,35,51,0.5); font-size:14px; }

  /* ---------- Modal ---------- */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(28,35,51,0.5);
    align-items:center; justify-content:center; padding:20px; z-index:100;
  }
  .modal-overlay.show{ display:flex; }
  .modal{
    background:var(--parchment); border-radius:14px; padding:32px; width:100%; max-width:460px;
    max-height:90vh; overflow-y:auto;
  }
  .modal h2{ font-family:var(--display); font-size:22px; font-weight:700; margin-bottom:22px; }

  form{ display:flex; flex-direction:column; gap:18px; }
  .field label{ display:flex; font-size:13.5px; font-weight:600; margin-bottom:7px; gap:4px; }
  .field .req{ color:var(--brick); }
  .field input, .field textarea{
    width:100%; padding:12px 14px; font-size:15px; font-family:var(--body);
    background:#fff; border:1px solid rgba(28,35,51,0.2); border-radius:7px; color:var(--ink);
  }
  .field input{ min-height:46px; }
  .field textarea{ min-height:90px; resize:vertical; }
  .field input:focus, .field textarea:focus{
    outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(62,124,116,0.15);
  }
  .field input[aria-invalid="true"]{ border-color:var(--brick); }
  .error{
    font-size:12.5px; color:var(--brick); margin-top:6px; display:none; align-items:flex-start; gap:6px;
  }
  .error.show{ display:flex; }
  .error svg{ flex-shrink:0; margin-top:1px; stroke:var(--brick); }

  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:6px; }
  .modal-actions .btn-primary{ background:var(--amber); color:var(--ink); }
  .modal-actions .btn-secondary{ background:var(--parchment-dim); color:var(--ink); }
  .modal-actions .btn-secondary:hover{ background:#e2dbc7; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--parchment); padding:14px 22px; border-radius:8px;
    font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
    z-index:200; display:flex; align-items:center; gap:10px;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast svg{ stroke:var(--teal); flex-shrink:0; }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-header-left">
    <span class="logo">Cadence<span class="dot">.</span></span>
    <nav class="app-nav">
      <a href="clients.html" class="active">Clients</a>
      <a href="agenda.html">Agenda</a>
      <a href="devis-factures.html">Devis &amp; factures</a>
      <a href="parametres.html">Paramètres</a>
    </nav>
  </div>
  <div class="app-header-right">
    <span class="user-email" id="user-email"></span>
    <button class="btn btn-ghost" id="logout-btn" type="button">Se déconnecter</button>
  </div>
</header>

<main class="app-main">
  <div class="app-container">
    <div class="page-head">
      <div>
        <h1>Vos clients</h1>
        <p id="page-sub">Historique, notes de séance, coordonnées — tout au même endroit.</p>
      </div>
      <button class="btn btn-primary" id="add-client-btn" type="button">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Ajouter un client
      </button>
    </div>

    <div id="loading-state" class="loading-state">Chargement…</div>

    <div id="empty-state" class="empty-state" style="display:none;">
      <div class="icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <h2>Aucun client pour l'instant</h2>
      <p>Ajoutez le premier pour commencer à suivre sa fiche.</p>
      <button class="btn btn-primary" id="empty-add-btn" type="button">Ajouter mon premier client</button>
    </div>

    <div id="client-list" class="client-list"></div>
  </div>
</main>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-title">Ajouter un client</h2>
    <form id="client-form" novalidate>
      <input type="hidden" id="client-id">
      <div class="field">
        <label for="full_name">Nom complet <span class="req">*</span></label>
        <input type="text" id="full_name" name="full_name" aria-describedby="full_name-error" required>
        <div class="error" id="full_name-error"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg><span></span></div>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" aria-describedby="email-error">
        <div class="error" id="email-error"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg><span></span></div>
      </div>
      <div class="field">
        <label for="phone">Téléphone</label>
        <input type="tel" id="phone" name="phone">
      </div>
      <div class="field">
        <label for="company">Entreprise</label>
        <input type="text" id="company" name="company">
      </div>
      <div class="field">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" placeholder="Historique, préférences, notes de séance…"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancel-btn">Annuler</button>
        <button type="submit" class="btn btn-primary" id="save-btn">Enregistrer</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  <span id="toast-text"></span>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  import { SUPABASE_URL, SUPABASE_ANON_KEY } from './supabase-config.js';
  import { initTheme, vocabulaire, viderCacheBrand } from './theme.js';

  const configured = !SUPABASE_URL.includes('YOUR-PROJECT') && !SUPABASE_ANON_KEY.includes('YOUR-ANON');
  if(!configured){
    document.body.innerHTML = '<div style="max-width:480px;margin:80px auto;text-align:center;padding:0 20px;font-family:Inter,Arial,sans-serif;">' +
      '<h1 style="font-family:Fraunces,Georgia,serif;font-size:24px;margin-bottom:12px;">Supabase non configuré</h1>' +
      '<p style="color:rgba(28,35,51,0.6);line-height:1.6;">Renseignez <code>supabase-config.js</code> avec votre URL et votre clé Supabase pour utiliser les fiches clients.</p>' +
      '<a href="index.html" style="color:#3E7C74;font-weight:600;display:inline-block;margin-top:20px;">Retour à l\'accueil</a></div>';
  } else {
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const listEl = document.getElementById('client-list');
  const loadingEl = document.getElementById('loading-state');
  const emptyEl = document.getElementById('empty-state');
  const overlay = document.getElementById('modal-overlay');
  const modalTitle = document.getElementById('modal-title');
  const form = document.getElementById('client-form');
  const toast = document.getElementById('toast');
  const toastText = document.getElementById('toast-text');

  let session = null;

  // Le vocabulaire du metier remplace les mots generiques de l'ecran.
  function appliquerVocabulaire(brand){
    const v = vocabulaire(brand);
    document.getElementById('page-sub').textContent =
      `Historique, notes de ${v.singulier}, coordonnées — tout au même endroit.`;
    document.getElementById('notes').placeholder =
      `Historique, préférences, notes de ${v.singulier}…`;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function showToast(message){
    toastText.textContent = message;
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 3200);
  }

  function setFieldError(id, message){
    const input = document.getElementById(id);
    const errorEl = document.getElementById(id + '-error');
    if(!errorEl) return;
    if(message){
      input.setAttribute('aria-invalid', 'true');
      errorEl.querySelector('span').textContent = message;
      errorEl.classList.add('show');
    } else {
      input.removeAttribute('aria-invalid');
      errorEl.classList.remove('show');
    }
  }

  function openModal(client){
    form.reset();
    ['full_name','email'].forEach(id => setFieldError(id, ''));
    if(client){
      modalTitle.textContent = 'Modifier le client';
      document.getElementById('client-id').value = client.id;
      document.getElementById('full_name').value = client.full_name || '';
      document.getElementById('email').value = client.email || '';
      document.getElementById('phone').value = client.phone || '';
      document.getElementById('company').value = client.company || '';
      document.getElementById('notes').value = client.notes || '';
    } else {
      modalTitle.textContent = 'Ajouter un client';
      document.getElementById('client-id').value = '';
    }
    overlay.classList.add('show');
    document.getElementById('full_name').focus();
  }

  function closeModal(){
    overlay.classList.remove('show');
  }

  document.getElementById('add-client-btn').addEventListener('click', ()=> openModal(null));
  document.getElementById('empty-add-btn').addEventListener('click', ()=> openModal(null));
  document.getElementById('cancel-btn').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape' && overlay.classList.contains('show')) closeModal(); });

  function renderClients(clients){
    loadingEl.style.display = 'none';
    if(!clients.length){
      emptyEl.style.display = 'block';
      listEl.innerHTML = '';
      return;
    }
    emptyEl.style.display = 'none';
    listEl.innerHTML = clients.map(c => `
      <div class="client-row" data-id="${c.id}">
        <div class="client-row-main">
          <h3>${escapeHtml(c.full_name)}</h3>
          <div class="client-row-meta">
            ${c.company ? `<span>${escapeHtml(c.company)}</span>` : ''}
            ${c.email ? `<span>${escapeHtml(c.email)}</span>` : ''}
            ${c.phone ? `<span>${escapeHtml(c.phone)}</span>` : ''}
          </div>
        </div>
        <div class="client-row-actions">
          <button class="icon-btn edit-btn" type="button" aria-label="Modifier ${escapeHtml(c.full_name)}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
          </button>
          <button class="icon-btn danger delete-btn" type="button" aria-label="Supprimer ${escapeHtml(c.full_name)}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
          </button>
        </div>
      </div>
    `).join('');

    listEl.querySelectorAll('.client-row').forEach(row=>{
      const id = row.dataset.id;
      const client = clients.find(c => c.id === id);
      row.querySelector('.edit-btn').addEventListener('click', (e)=>{ e.stopPropagation(); openModal(client); });
      row.querySelector('.delete-btn').addEventListener('click', (e)=>{ e.stopPropagation(); deleteClient(id, client.full_name); });
      row.addEventListener('click', ()=> openModal(client));
    });
  }

  async function loadClients(){
    loadingEl.style.display = 'block';
    emptyEl.style.display = 'none';
    const { data, error } = await supabase.from('clients').select('*').order('created_at', { ascending: false });
    if(error){
      loadingEl.textContent = "Impossible de charger vos clients pour le moment.";
      return;
    }
    renderClients(data);
  }

  async function deleteClient(id, name){
    if(!window.confirm(`Supprimer la fiche de ${name} ? Cette action est irréversible.`)) return;
    const { error } = await supabase.from('clients').delete().eq('id', id);
    if(error){
      showToast("La suppression a échoué. Réessayez.");
      return;
    }
    showToast('Client supprimé.');
    loadClients();
  }

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fullName = document.getElementById('full_name').value.trim();
    const email = document.getElementById('email').value.trim();

    let hasError = false;
    if(fullName.length < 2){
      setFieldError('full_name', 'Indiquez le nom du client.');
      hasError = true;
    } else {
      setFieldError('full_name', '');
    }
    if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
      setFieldError('email', "L'adresse email doit être au format nom@domaine.fr.");
      hasError = true;
    } else {
      setFieldError('email', '');
    }
    if(hasError) return;

    const id = document.getElementById('client-id').value;
    const payload = {
      full_name: fullName,
      email: email || null,
      phone: document.getElementById('phone').value.trim() || null,
      company: document.getElementById('company').value.trim() || null,
      notes: document.getElementById('notes').value.trim() || null
    };

    const saveBtn = document.getElementById('save-btn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Enregistrement…';

    const { error } = id
      ? await supabase.from('clients').update(payload).eq('id', id)
      : await supabase.from('clients').insert(payload);

    saveBtn.disabled = false;
    saveBtn.textContent = 'Enregistrer';

    if(error){
      showToast("L'enregistrement a échoué. Réessayez.");
      return;
    }

    closeModal();
    showToast(id ? 'Client mis à jour.' : 'Client ajouté.');
    loadClients();
  });

  document.getElementById('logout-btn').addEventListener('click', async ()=>{
    viderCacheBrand();
    await supabase.auth.signOut();
    window.location.href = 'login.html';
  });

  (async function init(){
    const { data } = await supabase.auth.getSession();
    session = data.session;
    if(!session){
      window.location.href = 'login.html';
      return;
    }
    document.getElementById('user-email').textContent = session.user.email;
    const brand = await initTheme(supabase, 'clients');
    appliquerVocabulaire(brand);
    loadClients();
  })();
  }
</script>

</body>
</html>
