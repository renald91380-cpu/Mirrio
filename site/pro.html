<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiche professionnel — Cadence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{ --ink:#1C2333; --parchment:#F5F1E7; --teal:#3E7C74; --amber:#E2A63D; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Inter', Arial, sans-serif; background:var(--parchment); color:var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased; }
  header{ background:var(--ink); padding:14px 20px; display:flex; justify-content:space-between; }
  header a{ color:var(--parchment); text-decoration:none; font-size:14px; }
  .logo{ font-family:'Fraunces', Georgia, serif; font-weight:700; font-size:20px; }
  main{ max-width:900px; margin:0 auto; padding:24px 20px 70px; }
  .galerie{ display:grid; grid-template-columns:2fr 1fr 1fr; grid-auto-rows:150px; gap:8px; border-radius:12px; overflow:hidden; margin-bottom:20px; }
  .galerie img{ width:100%; height:100%; object-fit:cover; }
  .galerie img:first-child{ grid-row:span 2; }
  @media(max-width:600px){ .galerie{ grid-template-columns:1fr 1fr; } .galerie img:first-child{ grid-column:span 2; grid-row:auto; } }
  h1{ font-family:'Fraunces', Georgia, serif; font-size:30px; }
  .meta{ color:rgba(28,35,51,0.6); font-size:14px; margin:4px 0 14px; }
  .etoiles{ color:var(--amber); letter-spacing:1px; }
  .bloc{ background:#fff; border-radius:12px; padding:20px; margin-bottom:16px; box-shadow:0 1px 3px rgba(28,35,51,0.08); }
  .bloc h2{ font-family:'Fraunces', Georgia, serif; font-size:19px; margin-bottom:12px; }
  .onglets{ display:inline-flex; background:rgba(28,35,51,0.06); border-radius:9px; padding:3px; margin-bottom:12px; }
  .onglets button{ border:none; background:none; padding:7px 16px; border-radius:7px; font:600 13.5px Inter, sans-serif; color:rgba(28,35,51,0.6); cursor:pointer; }
  .onglets button.on{ background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(28,35,51,0.15); }
  .cat{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:rgba(28,35,51,0.5); margin:14px 0 2px; font-weight:700; }
  .presta{ display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-top:1px solid rgba(28,35,51,0.08); }
  .presta:first-of-type{ border-top:none; }
  .presta small{ color:rgba(28,35,51,0.55); display:block; }
  .avis{ padding:12px 0; border-top:1px solid rgba(28,35,51,0.08); font-size:14px; }
  .avis:first-of-type{ border-top:none; }
  .avis small{ color:rgba(28,35,51,0.55); }
  #carte{ height:260px; border-radius:10px; margin-top:10px; }
  .cta{ position:sticky; bottom:0; background:var(--parchment); padding:12px 0; text-align:center; }
  .btn{ display:inline-block; padding:13px 30px; font-weight:700; border-radius:10px; background:var(--ink); color:var(--parchment); text-decoration:none; }
  .btn:hover{ background:var(--teal); }
  .etat{ text-align:center; padding:60px 20px; color:rgba(28,35,51,0.55); }
</style>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1C2333">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cadence">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script src="/pwa.js" defer></script>
</head>
<body>
<header><a class="logo" href="index.html">Cadence</a><a href="explorer.html">← Tous les professionnels</a></header>
<main id="contenu"><div class="etat">Chargement…</div></main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const slug = new URLSearchParams(location.search).get('p') || '';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const urlSure = u => /^https:\/\//i.test(u) ? u : '';
  const etoiles = n => '★'.repeat(Math.round(n)) + '☆'.repeat(5 - Math.round(n));
  const prix = n => Number(n).toFixed(2).replace('.', ',') + ' €';
  const LIB = { coiffure:'Coiffure', barbier:'Barbier', massage:'Massage & spa', esthetique:'Esthétique', onglerie:'Onglerie', therapeute:'Bien-être', coach:'Coaching',
    photographe:'Photographie', formateur:'Formation', professeur:'Cours particuliers', consultant:'Conseil', autre:'Autre' };

  (async () => {
    const el = document.getElementById('contenu');
    try{
      const r = await fetch('/api/annuaire?slug=' + encodeURIComponent(slug));
      if(!r.ok) throw 0;
      const x = await r.json();
      document.title = `${x.nom} — Cadence`;
      const photos = (x.photos || []).map(urlSure).filter(Boolean).slice(0, 5);
      el.innerHTML = `
        ${photos.length ? `<div class="galerie">${photos.map(u => `<img src="${esc(u)}" alt="" loading="lazy">`).join('')}</div>` : ''}
        <h1>${esc(x.nom)}</h1>
        <div class="meta">${esc(LIB[x.metier] || 'Autre')}${x.ville ? ' · ' + esc(x.ville) : ''}
          ${x.nb_avis ? ` · <span class="etoiles">${etoiles(x.note_moyenne)}</span> ${x.note_moyenne} (${x.nb_avis} avis)` : ' · Pas encore d\'avis'}</div>
        ${x.description ? `<div class="bloc"><p>${esc(x.description)}</p></div>` : ''}
        <div class="bloc"><h2>Prestations</h2>
          ${(x.publics || []).length > 1 ? `<div class="onglets" id="onglets"><button data-p="" class="on">Tous</button><button data-p="femme">Femme</button><button data-p="homme">Homme</button></div>` : ''}
          <div id="liste-presta"></div></div>
        ${x.latitude != null ? `<div class="bloc"><h2>Où nous trouver</h2>${x.adresse ? `<p>${esc(x.adresse)}</p>` : ''}<div id="carte"></div></div>` : ''}
        <div class="bloc"><h2>Avis clients</h2>
          ${x.avis.length ? x.avis.map(a => `<div class="avis"><span class="etoiles">${etoiles(a.note)}</span>
            <small> ${esc(a.auteur || 'Client')} · ${new Date(a.created_at).toLocaleDateString('fr-FR')}</small>
            ${a.commentaire ? `<p>${esc(a.commentaire)}</p>` : ''}</div>`).join('')
            : '<p class="meta">Les avis sont déposés uniquement par des clients ayant eu un rendez-vous.</p>'}</div>
        <div class="cta"><a class="btn" href="reservation.html?p=${encodeURIComponent(x.slug)}">Réserver un rendez-vous</a></div>`;
      const dessinerPrestations = pub => {
        const liste = x.prestations.filter(p => !pub || (p.public_cible || 'mixte') === 'mixte' || p.public_cible === pub);
        let cat = null, out = '';
        liste.forEach(p => {
          const c = p.categorie || '';
          if(c !== cat){ cat = c; if(c) out += `<div class="cat">${esc(c)}</div>`; }
          out += `<div class="presta"><div><strong>${esc(p.libelle)}</strong>
            <small>${p.duree_minutes} min${p.description ? ' · ' + esc(p.description) : ''}</small></div>
            <strong>${prix(p.prix_unitaire)}</strong></div>`;
        });
        document.getElementById('liste-presta').innerHTML = out || '<p class="meta">Aucune prestation pour ce public.</p>';
      };
      dessinerPrestations('');
      document.querySelectorAll('#onglets button').forEach(b => b.addEventListener('click', () => {
        document.querySelectorAll('#onglets button').forEach(o => o.classList.toggle('on', o === b));
        dessinerPrestations(b.dataset.p);
      }));
      if(x.latitude != null && window.L){
        const m = L.map('carte').setView([x.latitude, x.longitude], 15);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(m);
        L.marker([x.latitude, x.longitude]).addTo(m);
      }
    }catch(e){
      el.innerHTML = '<div class="etat">Cette fiche est introuvable.</div>';
    }
  })();
</script>
</body>
</html>
