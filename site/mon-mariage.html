<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon mariage | Mirrio</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#101216">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  :root{
    --bg:#F5F5F3; --surface:#FBFBFA; --ink:#101216; --muted:#5B606B; --line:rgba(16,18,22,.12);
    --accent:#E2A63D; --accent-ink:#101216; --ok:#2E7D5B; --alerte:#B3402A;
    --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Geist',system-ui,sans-serif;
    --ombre:0 1px 2px rgba(16,18,22,.05), 0 12px 30px -14px rgba(16,18,22,.18);
  }
  @media (prefers-color-scheme:dark){ :root{ --bg:#0D0F13; --surface:#15181E; --ink:#F1F1EE; --muted:#9CA2AE; --line:rgba(255,255,255,.14); --ok:#5CC08F; --alerte:#F0836C; --ombre:0 1px 2px rgba(0,0,0,.3), 0 14px 34px -14px rgba(0,0,0,.6); } }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--ink); font:400 15px/1.55 var(--body); -webkit-font-smoothing:antialiased; }
  a{ color:inherit; }
  h1,h2,h3{ font-family:var(--display); letter-spacing:-.02em; line-height:1.15; }
  .evitement{ position:absolute; left:-9999px; } .evitement:focus{ left:12px; top:12px; background:var(--accent); color:var(--accent-ink); padding:10px 16px; border-radius:999px; z-index:50; }
  header{ position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .barre{ max-width:1000px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .logo{ font:800 21px var(--display); text-decoration:none; } .logo b{ color:var(--accent); }
  .barre .droite{ display:flex; gap:10px; align-items:center; font-size:14px; color:var(--muted); }
  main{ max-width:1000px; margin:0 auto; padding:24px 20px 90px; }
  nav.onglets{ display:flex; gap:6px; overflow-x:auto; padding:2px 0 14px; scrollbar-width:none; }
  nav.onglets button{ flex:none; min-height:44px; padding:0 18px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:600 15px var(--body); cursor:pointer; }
  nav.onglets button[aria-selected=true]{ background:var(--ink); color:var(--bg); border-color:transparent; }
  .btn{ min-height:44px; padding:0 20px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--ink); font:600 15px var(--body); cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
  .btn.principal{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
  .btn.petit{ min-height:36px; padding:0 14px; font-size:14px; } .btn.danger{ color:var(--alerte); }
  .btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  .carte{ background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:22px; box-shadow:var(--ombre); }
  .grille{ display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); }
  .grand{ font:800 44px/1 var(--display); letter-spacing:-.04em; } .muted{ color:var(--muted); }
  .barre-prog{ height:10px; border-radius:99px; background:var(--line); overflow:hidden; margin:10px 0 6px; } .barre-prog i{ display:block; height:100%; background:var(--accent); }
  .barre-prog.rouge i{ background:var(--alerte); }
  .rang{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .rang:last-child{ border-bottom:none; } .rang .corps{ flex:1; min-width:0; } .rang .titre{ font-weight:600; } .rang .titre.fait{ text-decoration:line-through; color:var(--muted); }
  .rang input[type=checkbox]{ width:24px; height:24px; accent-color:var(--accent); flex:none; }
  .puce{ display:inline-block; padding:3px 11px; border-radius:99px; font-size:13px; font-weight:600; border:1px solid var(--line); }
  .puce.ok{ color:var(--ok); border-color:currentColor; } .puce.ko{ color:var(--alerte); border-color:currentColor; } .puce.att{ color:var(--muted); }
  .alerte{ color:var(--alerte); font-weight:600; }
  .actions{ display:flex; flex-wrap:wrap; gap:10px; margin:0 0 16px; align-items:center; }
  table{ width:100%; border-collapse:collapse; font-size:14px; } th,td{ text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; } th{ color:var(--muted); font-weight:500; }
  td.num,th.num{ text-align:right; white-space:nowrap; } .scroll-x{ overflow-x:auto; }
  dialog{ border:none; border-radius:24px; padding:24px; width:min(520px,calc(100vw - 24px)); background:var(--surface); color:var(--ink); box-shadow:0 30px 80px -20px rgba(0,0,0,.5); }
  dialog::backdrop{ background:rgba(8,10,14,.55); }
  .champ{ margin:0 0 14px; } .champ label{ display:block; font-weight:600; margin-bottom:6px; }
  .champ input,.champ select,.champ textarea{ width:100%; min-height:46px; padding:11px 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:inherit; }
  .champ textarea{ min-height:110px; resize:vertical; }
  .erreur{ color:var(--alerte); font-weight:600; min-height:1.4em; }
  #toast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:12px 20px; border-radius:99px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .25s; z-index:60; }
  #toast.on{ opacity:1; }
  .vide{ text-align:center; padding:36px 10px; color:var(--muted); }
  .resultat{ display:flex; gap:14px; align-items:center; padding:14px 0; border-bottom:1px solid var(--line); } .resultat:last-child{ border:none; }
  .resultat img{ width:64px; height:64px; border-radius:16px; object-fit:cover; background:var(--line); flex:none; }
  @media (max-width:560px){ .grand{ font-size:36px; } th:nth-child(n+6),td:nth-child(n+6){ display:none; } }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>
<script src="/pwa.js" defer></script>
<script src="/cookies.js" defer></script>
</head>
<body>
<a class="evitement" href="#contenu">Aller au contenu</a>
<header><div class="barre">
  <a class="logo" href="mariage.html">Mirrio<b>.</b></a>
  <div class="droite"><span id="qui"></span><button class="btn petit" id="sortir" type="button">Se déconnecter</button></div>
</div></header>

<main id="contenu">
  <div id="chargement" class="vide">Chargement…</div>
  <div id="creation" hidden></div>
  <div id="appli" hidden>
    <nav class="onglets" role="tablist" aria-label="Sections du mariage" id="onglets">
      <button role="tab" data-t="apercu" aria-selected="true">Aperçu</button>
      <button role="tab" data-t="taches" aria-selected="false">Checklist</button>
      <button role="tab" data-t="budget" aria-selected="false">Budget</button>
      <button role="tab" data-t="invites" aria-selected="false">Invités</button>
      <button role="tab" data-t="presta" aria-selected="false">Prestataires</button>
    </nav>
    <section id="vue" role="tabpanel" tabindex="-1"></section>
  </div>
</main>
<div id="toast" role="status"></div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  import { SUPABASE_URL, SUPABASE_ANON_KEY } from './supabase-config.js';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = s => document.querySelector(s);
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const eur = n => (Number(n) || 0).toLocaleString('fr-FR', { style:'currency', currency:'EUR', maximumFractionDigits:0 });
  const num = v => { const n = Number(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) && n >= 0 ? n : 0; };
  const dateFr = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' }) : '';
  const iso = d => d.toISOString().slice(0, 10);
  const aujourdhui = () => iso(new Date());
  function toast(t){ const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2600); }
  const msgErreur = e => (e && e.message) ? e.message.replace(/^.*?:\s*/, '') : 'Une erreur est survenue.';

  // ------------------------------------------------------------------ modèles
  const CATEGORIES = { general:'Général', lieu:'Lieu', traiteur:'Traiteur', photo:'Photo et vidéo', musique:'Musique', deco:'Fleurs et décoration', tenues:'Tenues', beaute:'Coiffure et maquillage', gateau:'Gâteau', transport:'Transport', papeterie:'Faire-part', admin:'Administratif' };
  // [mois avant le mariage, titre, catégorie] : checklist indicative, à adapter au pays, à la religion et au style du mariage.
  const TACHES_TYPE = [
    [12,'Fixer le budget et le nombre d\'invités approximatif','general'],[12,'Choisir la date et la ville','general'],[12,'Réserver le lieu de réception','lieu'],
    [11,'Réserver le traiteur','traiteur'],[11,'Réserver le photographe et le vidéaste','photo'],[9,'Réserver le DJ ou le groupe','musique'],
    [9,'Choisir les tenues des mariés','tenues'],[8,'Réserver le fleuriste et la décoration','deco'],[6,'Envoyer les « save the date »','papeterie'],
    [6,'Réserver coiffure et maquillage, prévoir un essai','beaute'],[5,'Organiser le transport des mariés et des invités','transport'],
    [4,'Envoyer les faire-part','papeterie'],[4,'Constituer le dossier administratif (mairie ou équivalent)','admin'],[3,'Dégustation et menu définitif avec le traiteur','traiteur'],
    [3,'Commander la pièce montée ou le gâteau','gateau'],[2,'Essayages finaux des tenues','tenues'],[1,'Confirmer chaque prestataire par écrit','general'],
    [1,'Établir le plan de table','general'],[1,'Relancer les invités sans réponse','general'],[0,'Confirmer les horaires avec chaque prestataire (la semaine précédente)','general'],
    [0,'Préparer les enveloppes et les pourboires des prestataires','general']
  ];
  // Répartition indicative du budget, en pourcentage : une base de départ à ajuster, pas une règle.
  const BUDGET_TYPE = [['Lieu de réception',20],['Traiteur et boissons',28],['Photo et vidéo',10],['Musique et animation',7],['Fleurs et décoration',8],['Tenues',10],['Coiffure et maquillage',3],['Gâteau ou pièce montée',3],['Transport',2],['Faire-part et papeterie',2],['Alliances',3],['Imprévus',4]];

  let session = null, M = null, taches = [], budget = [], invites = [], demandes = [], onglet = 'apercu';

  // ------------------------------------------------------------------ formulaire modal réutilisable
  function formulaire(titre, champs, valeurs = {}, libelleOk = 'Enregistrer'){
    return new Promise(resolve => {
      const d = document.createElement('dialog');
      d.setAttribute('aria-labelledby', 'dlg-t');
      d.innerHTML = `<form method="dialog" novalidate><h2 id="dlg-t" style="font-size:22px;margin-bottom:16px">${esc(titre)}</h2>
        ${champs.map(c => {
          const v = valeurs[c.n] != null ? valeurs[c.n] : (c.val != null ? c.val : '');
          const attrs = `id="f-${c.n}" name="${c.n}"${c.req ? ' required' : ''}${c.ph ? ` placeholder="${esc(c.ph)}"` : ''}`;
          let champ;
          if(c.type === 'select') champ = `<select ${attrs}>${c.options.map(([k, l]) => `<option value="${esc(k)}"${String(v) === String(k) ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
          else if(c.type === 'textarea') champ = `<textarea ${attrs}>${esc(v)}</textarea>`;
          else champ = `<input ${attrs} type="${c.type || 'text'}" value="${esc(v)}"${c.type === 'number' ? ' min="0" step="any" inputmode="decimal"' : ''}>`;
          return `<div class="champ"><label for="f-${c.n}">${esc(c.label)}${c.req ? '' : ' <span class="muted" style="font-weight:400">(facultatif)</span>'}</label>${champ}</div>`;
        }).join('')}
        <p class="erreur" role="alert" id="dlg-err"></p>
        <div class="actions" style="justify-content:flex-end;margin:6px 0 0"><button class="btn" value="annuler" type="button" id="dlg-non">Annuler</button><button class="btn principal" type="submit">${esc(libelleOk)}</button></div></form>`;
      document.body.appendChild(d);
      const fin = r => { d.close(); d.remove(); resolve(r); };
      d.querySelector('#dlg-non').onclick = () => fin(null);
      d.addEventListener('cancel', e => { e.preventDefault(); fin(null); });
      d.querySelector('form').addEventListener('submit', e => {
        e.preventDefault();
        const f = e.target, out = {};
        for(const c of champs){
          const val = f.elements[c.n].value.trim();
          if(c.req && !val){ $('#dlg-err').textContent = `« ${c.label} » est obligatoire.`; f.elements[c.n].focus(); return; }
          out[c.n] = val;
        }
        fin(out);
      });
      d.showModal();
      d.querySelector('input,select,textarea').focus();
    });
  }
  const confirmer = async (texte, ok = 'Confirmer') => !!(await formulaire(texte, [], {}, ok));

  // ------------------------------------------------------------------ données
  async function charger(){
    const { data: m } = await supabase.from('mariages').select('*').limit(1).maybeSingle();
    M = m;
    if(!M) return;
    const [t, b, i, d] = await Promise.all([
      supabase.from('mariage_taches').select('*').eq('mariage_id', M.id).order('echeance', { nullsFirst:false }).order('created_at'),
      supabase.from('mariage_budget').select('*').eq('mariage_id', M.id).order('created_at'),
      supabase.from('mariage_invites').select('*').eq('mariage_id', M.id).order('nom'),
      supabase.from('mariage_demandes').select('*').eq('mariage_id', M.id).order('created_at', { ascending:false })
    ]);
    taches = t.data || []; budget = b.data || []; invites = i.data || []; demandes = d.data || [];
  }

  // ------------------------------------------------------------------ création du mariage
  function afficherCreation(){
    $('#chargement').hidden = true; $('#appli').hidden = true;
    const z = $('#creation'); z.hidden = false;
    z.innerHTML = `<div class="carte" style="max-width:560px;margin:20px auto">
      <h1 style="font-size:30px;margin-bottom:6px">Organisons votre mariage.</h1>
      <p class="muted" style="margin-bottom:18px">Quelques informations pour démarrer. Tout est modifiable plus tard.</p>
      <form id="form-creation" novalidate>
        <div class="champ"><label for="c-titre">Titre</label><input id="c-titre" value="Notre mariage" maxlength="120"></div>
        <div class="champ"><label for="c-date">Date du mariage <span class="muted" style="font-weight:400">(facultatif)</span></label><input id="c-date" type="date"></div>
        <div class="champ"><label for="c-ville">Ville <span class="muted" style="font-weight:400">(facultatif)</span></label><input id="c-ville" maxlength="80" autocomplete="address-level2"></div>
        <div class="champ"><label for="c-budget">Budget total en € <span class="muted" style="font-weight:400">(facultatif)</span></label><input id="c-budget" inputmode="decimal"></div>
        <div class="champ"><label for="c-inv">Nombre d'invités estimé <span class="muted" style="font-weight:400">(facultatif)</span></label><input id="c-inv" inputmode="numeric"></div>
        <p class="erreur" id="c-err" role="alert"></p>
        <button class="btn principal" type="submit" style="width:100%">Créer mon mariage</button>
      </form></div>`;
    $('#form-creation').addEventListener('submit', async e => {
      e.preventDefault();
      const budgetTotal = $('#c-budget').value.trim() ? num($('#c-budget').value) : null;
      const nb = $('#c-inv').value.trim() ? Math.round(num($('#c-inv').value)) : null;
      const { error } = await supabase.from('mariages').insert({
        titre: $('#c-titre').value.trim() || 'Notre mariage', date_mariage: $('#c-date').value || null,
        ville: $('#c-ville').value.trim() || null, budget_total: budgetTotal, nb_invites: nb });
      if(error){ $('#c-err').textContent = /does not exist|schema cache/i.test(error.message) ? 'Base non préparée : exécuter db/schema-v37-mariage.sql dans Supabase.' : msgErreur(error); return; }
      z.hidden = true; await demarrer();
    });
  }

  // ------------------------------------------------------------------ onglets
  const VUES = { apercu:vueApercu, taches:vueTaches, budget:vueBudget, invites:vueInvites, presta:vuePresta };
  function afficher(t){
    onglet = t;
    document.querySelectorAll('#onglets button').forEach(b => b.setAttribute('aria-selected', b.dataset.t === t));
    VUES[t]();
  }
  $('#onglets').addEventListener('click', e => { const b = e.target.closest('button[data-t]'); if(b) afficher(b.dataset.t); });
  $('#onglets').addEventListener('keydown', e => {
    const bs = [...document.querySelectorAll('#onglets button')], i = bs.findIndex(b => b.dataset.t === onglet);
    const d = { ArrowRight:1, ArrowLeft:-1 }[e.key]; if(!d) return;
    const n = bs[(i + d + bs.length) % bs.length]; n.focus(); afficher(n.dataset.t);
  });

  // ------------------------------------------------------------------ aperçu
  function totauxBudget(){
    const prevu = budget.reduce((s, l) => s + Number(l.prevu), 0), montant = budget.reduce((s, l) => s + Number(l.montant), 0), paye = budget.reduce((s, l) => s + Number(l.paye), 0);
    return { prevu, montant, paye, reste: Math.max(0, montant - paye) };
  }
  function vueApercu(){
    const jours = M.date_mariage ? Math.ceil((new Date(M.date_mariage + 'T12:00:00') - new Date()) / 86400000) : null;
    const faites = taches.filter(t => t.fait).length, tp = taches.length ? Math.round(faites / taches.length * 100) : 0;
    const bt = totauxBudget(), plafond = Number(M.budget_total) || 0, depasse = plafond && bt.montant > plafond;
    const oui = invites.filter(i => i.statut === 'oui'), pers = oui.reduce((s, i) => s + i.nb_personnes, 0);
    const suivantes = taches.filter(t => !t.fait).slice(0, 5);
    const aTraiter = demandes.filter(d => d.statut === 'repondue').length;
    $('#vue').innerHTML = `
      <div class="carte" style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start">
          <div><h1 style="font-size:28px">${esc(M.titre)}</h1><p class="muted">${M.date_mariage ? esc(dateFr(M.date_mariage)) : 'Date à définir'}${M.ville ? ' · ' + esc(M.ville) : ''}</p></div>
          <button class="btn petit" id="modif-m" type="button">Modifier</button>
        </div>
        <div class="grand" style="margin-top:14px">${jours == null ? '—' : jours > 0 ? 'J−' + jours : jours === 0 ? 'C\'est aujourd\'hui' : 'Terminé'}</div>
        ${jours == null ? '<p class="muted">Renseignez la date pour voir le compte à rebours.</p>' : ''}
      </div>
      <div class="grille">
        <div class="carte"><h2 style="font-size:19px">Checklist</h2><div class="grand" style="margin-top:8px">${tp} %</div>
          <div class="barre-prog" role="progressbar" aria-valuenow="${tp}" aria-valuemin="0" aria-valuemax="100" aria-label="Avancement de la checklist"><i style="width:${tp}%"></i></div>
          <p class="muted">${faites} sur ${taches.length} tâches faites</p></div>
        <div class="carte"><h2 style="font-size:19px">Budget</h2><div class="grand" style="margin-top:8px">${eur(bt.montant)}</div>
          ${plafond ? `<div class="barre-prog${depasse ? ' rouge' : ''}"><i style="width:${Math.min(100, Math.round(bt.montant / plafond * 100))}%"></i></div>
          <p class="${depasse ? 'alerte' : 'muted'}">${depasse ? 'Dépasse le budget de ' + eur(bt.montant - plafond) : eur(plafond - bt.montant) + ' disponibles sur ' + eur(plafond)}</p>` : '<p class="muted">Engagé auprès des prestataires</p>'}
          <p class="muted">Payé ${eur(bt.paye)} · reste à payer ${eur(bt.reste)}</p></div>
        <div class="carte"><h2 style="font-size:19px">Invités</h2><div class="grand" style="margin-top:8px">${pers}</div>
          <p class="muted">personnes confirmées · ${invites.filter(i => i.statut === 'attente').length} sans réponse · ${invites.filter(i => i.statut === 'non').length} absents${M.nb_invites ? ` · objectif ${M.nb_invites}` : ''}</p></div>
        <div class="carte"><h2 style="font-size:19px">Prestataires</h2><div class="grand" style="margin-top:8px">${demandes.length}</div>
          <p class="muted">demandes envoyées${aTraiter ? ` · <span class="alerte">${aTraiter} réponse${aTraiter > 1 ? 's' : ''} à examiner</span>` : ''}</p></div>
      </div>
      <div class="carte" style="margin-top:16px"><h2 style="font-size:19px;margin-bottom:6px">Prochaines tâches</h2>
        ${suivantes.length ? suivantes.map(t => ligneTache(t)).join('') : `<p class="vide">${taches.length ? 'Tout est fait, bravo !' : 'Aucune tâche pour le moment. Importez la checklist type dans l\'onglet Checklist.'}</p>`}
      </div>`;
    $('#modif-m').onclick = modifierMariage;
    brancherTaches();
  }
  async function modifierMariage(){
    const r = await formulaire('Votre mariage', [
      { n:'titre', label:'Titre', req:true }, { n:'date_mariage', label:'Date', type:'date' }, { n:'ville', label:'Ville' },
      { n:'budget_total', label:'Budget total en €', type:'number' }, { n:'nb_invites', label:'Nombre d\'invités estimé', type:'number' }],
      { titre:M.titre, date_mariage:M.date_mariage || '', ville:M.ville || '', budget_total:M.budget_total || '', nb_invites:M.nb_invites || '' });
    if(!r) return;

  }
  async function decider(id, statut){
    const d = demandes.find(x => x.id === id);
    const { error } = await supabase.rpc('mariage_decider', { p_demande:id, p_statut:statut });
    if(error) return toast(msgErreur(error));
    if(statut === 'acceptee' && d.montant_propose != null && await confirmer('Ajouter ce devis (' + eur(d.montant_propose) + ') à votre budget ?', 'Ajouter au budget')){
      await supabase.from('mariage_budget').insert({ mariage_id:M.id, poste:'Prestataire : ' + (d.prestataire_nom || ''), prevu:d.montant_propose, montant:d.montant_propose, prestataire:d.prestataire_nom });
    }
    await charger(); afficher('presta');
  }

  // ------------------------------------------------------------------ démarrage
  async function demarrer(){
    await charger();
    $('#chargement').hidden = true;
    if(!M){ afficherCreation(); return; }
    $('#creation').hidden = true; $('#appli').hidden = false;
    afficher(onglet);
  }
  (async function init(){
    const { data } = await supabase.auth.getSession();
    session = data.session;
    if(!session){ location.href = 'login.html'; return; }
    $('#qui').textContent = session.user.email;
    $('#sortir').onclick = async () => { await supabase.auth.signOut(); location.href = 'mariage.html'; };
    await demarrer();
  })();
</script>
</body>
</html>
