<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Reprendre la fiche de votre salon | Mirrio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1" defer></script>
<script src="demo-mode.js"></script>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#101216">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  :root{ --bg:#F5F5F3; --surface:#FBFBFA; --ink:#101216; --muted:#5B606B; --line:rgba(16,18,22,.12); --accent:#E2A63D; --icone:#A1700A; --sombre:#101216; --sombre-ink:#F1F1EE; --sombre-muted:#A3A8B3;
    --ombre:0 1px 2px rgba(16,18,22,.05), 0 12px 30px -14px rgba(16,18,22,.18); --ease:cubic-bezier(.16,1,.3,1); }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0D0F13; --surface:#15181E; --ink:#F1F1EE; --muted:#9CA2AE; --line:rgba(255,255,255,.14); --icone:#E2A63D; --sombre:#15181E; } }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Geist', system-ui, sans-serif; background:var(--bg); color:var(--ink); line-height:1.55; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  h1,h2,h3{ font-family:'Bricolage Grotesque', system-ui, sans-serif; letter-spacing:-.03em; line-height:1.06; }
  i.ph{ font-size:1.2em; line-height:1; }
  :focus-visible{ outline:3px solid var(--accent); outline-offset:3px; border-radius:8px; }
  .haut{ max-width:1000px; margin:0 auto; padding:22px 24px 0; display:flex; justify-content:space-between; align-items:center; }
  .logo{ font:800 24px 'Bricolage Grotesque', system-ui, sans-serif; letter-spacing:-.04em; } .logo b{ color:var(--accent); }
  main{ max-width:1000px; margin:0 auto; padding:40px 24px 90px; }
  .puce{ display:inline-flex; align-items:center; gap:8px; padding:8px 16px 8px 12px; border-radius:999px; background:var(--surface); border:1px solid var(--line); font-size:14px; font-weight:500; margin-bottom:22px; box-shadow:var(--ombre); }
  .puce i{ color:var(--icone); }
  h1{ font-size:clamp(34px, 6vw, 62px); font-weight:800; max-width:16ch; margin-bottom:16px; }
  .accroche{ font-size:19px; color:var(--muted); max-width:52ch; margin-bottom:30px; }
  .accroche b{ color:var(--ink); }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:52px; padding:0 28px; border-radius:999px; border:none; cursor:pointer; font:600 16px 'Geist', system-ui, sans-serif; background:var(--accent); color:#101216; transition:transform .35s var(--ease); box-shadow:0 8px 24px -8px rgba(226,166,61,.55); }
  .btn:hover{ transform:translateY(-2px); } .btn.discret{ background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line); }
  .actions{ display:flex; gap:12px; flex-wrap:wrap; }
  .avantages{ display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; margin:54px 0 0; } @media(max-width:820px){ .avantages{ grid-template-columns:1fr; } }
  .av{ padding:26px; border-radius:22px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--ombre); }
  .av i{ font-size:28px; color:var(--icone); display:block; margin-bottom:34px; } .av h3{ font-size:22px; font-weight:800; margin-bottom:6px; } .av p{ color:var(--muted); font-size:15px; }
  .offres{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:44px; } @media(max-width:700px){ .offres{ grid-template-columns:1fr; } }
  .offre{ padding:28px; border-radius:22px; background:var(--surface); border:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
  .offre.fort{ background:var(--sombre); color:var(--sombre-ink); border:none; } .offre.fort p, .offre.fort li{ color:var(--sombre-muted); }
  .offre h3{ font-size:24px; font-weight:800; } .offre .prix{ font:800 52px 'Bricolage Grotesque', system-ui, sans-serif; letter-spacing:-.05em; line-height:1; } .offre .prix small{ font:500 16px 'Geist', system-ui; letter-spacing:0; opacity:.7; }
  .offre ul{ list-style:none; display:grid; gap:8px; margin:10px 0 16px; font-size:15px; } .offre li{ display:flex; gap:10px; } .offre li i{ color:var(--icone); margin-top:3px; } .offre.fort li i{ color:var(--accent); }
  .offre .btn{ margin-top:auto; align-self:flex-start; }
  .note{ font-size:13.5px; color:var(--muted); margin-top:30px; max-width:70ch; } .note a{ text-decoration:underline; text-underline-offset:3px; }
  .bandeau-demo{ margin-bottom:22px; padding:12px 16px; border-radius:14px; background:color-mix(in srgb, var(--accent) 18%, var(--surface)); font-size:14px; font-weight:500; }
  .erreur{ padding:36px; border:1.5px dashed var(--line); border-radius:22px; text-align:center; color:var(--muted); }
  @media (prefers-reduced-motion: reduce){ .btn{ transition:none; } .btn:hover{ transform:none; } }
</style>
<link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand.css">
<script src="/cookies.js" defer></script>
</head>
<body>
<header class="haut"><a class="logo" href="index.html">Mirrio<b>.</b></a><a class="btn discret" style="min-height:44px;padding:0 20px;font-size:14.5px" href="explorer.html">Trouver un salon</a></header>
<main id="contenu"><div id="zone"><p style="color:var(--muted)">Chargement…</p></div></main>

<script>
(function(){
  var params = new URLSearchParams(location.search), id = params.get('f') || '', demo = params.get('demo') === '1';
  var $ = function(s){ return document.getElementById(s); };
  var esc = function(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
  var LIB = { coiffure:'Coiffure', barbier:'Barbier', esthetique:'Institut', onglerie:'Onglerie', massage:'Massage et spa', therapeute:'Bien-être', autre:'Beauté' };

  function vue(f){
    var n = Number(f.nb_demandes) || 0;
    var cible = 'signup.html?plan=studio&revendiquer=' + encodeURIComponent(f.id) + (demo ? '&demo=1' : '');
    var cibleSolo = 'signup.html?plan=solo&revendiquer=' + encodeURIComponent(f.id) + (demo ? '&demo=1' : '');
    var contact = 'mailto:contact@dima-artistry.com?subject=' + encodeURIComponent('Retrait de la fiche ' + f.nom);
    document.title = 'Reprendre la fiche de ' + f.nom + ' | Mirrio';
    $('zone').innerHTML =
      (demo ? '<div class="bandeau-demo">Exemple fictif : ce salon n\'existe pas, rien n\'est enregistré.</div>' : '') +
      '<span class="puce"><i class="ph ph-storefront" aria-hidden="true"></i>' + esc(LIB[f.metier] || 'Beauté') + (f.ville ? ', ' + esc(f.ville) : '') + '</span>' +
      '<h1>' + esc(f.nom) + ', vos clients vous attendent.</h1>' +
      '<p class="accroche">' + (n > 0
        ? '<b>' + n + ' ' + (n > 1 ? 'personnes ont' : 'personne a') + ' demandé</b> à réserver chez vous sur Mirrio. Pour l\'instant, personne ne peut le faire.'
        : 'Votre salon est déjà listé sur Mirrio, mais personne ne peut encore y réserver. Ouvrez vos réservations en dix minutes.') + ' Sans commission : chaque rendez-vous vous revient en entier.</p>' +
      (f.statut === 'en_cours'
        ? '<p class="accroche"><b>Une demande est déjà en cours pour cette fiche.</b> Si ce n\'est pas vous, écrivez-nous.</p>'
        : '<div class="actions"><a class="btn" href="' + cible + '">Reprendre ma fiche <i class="ph ph-arrow-right" aria-hidden="true"></i></a><a class="btn discret" href="demo-creation.html">Voir comment ça marche</a></div>') +
      '<div class="avantages">' +
        '<div class="av"><i class="ph ph-seal-check" aria-hidden="true"></i><h3>0 % de commission</h3><p>Un abonnement fixe, pas de pourcentage sur les rendez-vous ni sur les nouveaux clients.</p></div>' +
        '<div class="av"><i class="ph ph-tag" aria-hidden="true"></i><h3>Heures creuses</h3><p>Une remise de votre choix sur les créneaux vides, visible avant la réservation, pour remplir votre agenda.</p></div>' +
        '<div class="av"><i class="ph ph-credit-card" aria-hidden="true"></i><h3>Acompte garanti</h3><p>Chaque réservation demande au moins 5 € par carte, conservés si le client ne vient pas.</p></div>' +
      '</div>' +
      '<div class="offres">' +
        '<div class="offre fort"><h3>Salon</h3><div class="prix">20 €<small> /mois</small></div><p>Pour un salon, seul·e ou en équipe.</p><ul><li><i class="ph ph-check-circle" aria-hidden="true"></i>Agenda en colonnes, spécialités de chacun</li><li><i class="ph ph-check-circle" aria-hidden="true"></i>Clients illimités, rappels par email et SMS</li></ul><a class="btn" href="' + cible + '">Choisir Salon</a></div>' +
        '<div class="offre"><h3>Groupe</h3><div class="prix">50 €<small> /mois</small></div><p>Pour plusieurs salons.</p><ul><li><i class="ph ph-check-circle" aria-hidden="true"></i>Jusqu\'à 10 salons, un seul forfait</li><li><i class="ph ph-check-circle" aria-hidden="true"></i>Vue centralisée de tous vos salons</li></ul><a class="btn discret" href="' + cibleSolo + '">Choisir Groupe</a></div>' +
      '</div>' +
      '<p class="note">Ces informations sur votre salon proviennent d\'OpenStreetMap et sont publiques ; vous pourrez les corriger. Votre fiche sera vérifiée avant de passer en réservation. Vous ne souhaitez pas apparaître ? <a href="' + contact + '">Demandez le retrait de la fiche</a>, nous le faisons sans délai.</p>';
  }

  async function init(){
    if(!id){ $('zone').innerHTML = '<div class="erreur">Lien incomplet. <a href="explorer.html" style="text-decoration:underline">Retour à l\'annuaire</a>.</div>'; return; }
    try{
      var r = await fetch('/api/annuaire?fiche=' + encodeURIComponent(id));
      if(!r.ok) throw 0;
      vue(await r.json());
    }catch(e){ $('zone').innerHTML = '<div class="erreur">Cette fiche n\'existe plus ou a déjà été reprise. <a href="signup.html" style="text-decoration:underline">Créer mon salon</a>.</div>'; }
  }
  init();
})();
</script>
<script src="/pwa.js" defer></script>
</body>
</html>
